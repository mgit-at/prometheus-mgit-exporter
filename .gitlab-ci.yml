---
stages:
  - linter
  - build
  - scan
  - upload
  - add
  - sbom
  - upload-sbom

variables:
  GOLANGCI_LINT_VERSION: 'v2.12.2-alpine'
  TOOL: prometheus-mgit-exporter

lint:
  image: golangci/golangci-lint:$GOLANGCI_LINT_VERSION
  stage: linter
  script:
    # Use default .golangci.yml file from the image if one is not present in the project root.
    - '[ -e .golangci.yml ] || cp /golangci/.golangci.yml .'
    - golangci-lint run -v --config .golangci.yml

build:
  stage: build
  script:
    - bazel build --keep_going //...
  tags:
    - k8s-mgit-bazel

vulnerability_scan:
  stage: scan
  script:
    # 1. Run Go vulnerability check
    - bazel run @rules_go//go -- run golang.org/x/vuln/cmd/govulncheck@latest ./...

    # 2. Generate CycloneDX v1.6 SBOM using Syft
    - bazel run @rules_go//go -- run github.com/anchore/syft/cmd/syft@latest dir:. -o cyclonedx-json@1.6=sbom.json

    # 3. Scan the generated SBOM with Grype
    - bazel run @rules_go//go -- run github.com/anchore/grype/cmd/grype@latest sbom:sbom.json --config .grype.yaml
  artifacts:
    name: "sbom-$CI_COMMIT_REF_NAME"
    paths:
      - sbom.json
    expire_in: 30 days
    when: always
  allow_failure: true
  tags:
    - k8s-mgit-bazel

upload:
  stage: upload
  script:
    - upload-deb --config upload-deb.yaml
  artifacts:
    paths:
      - deb-out/*
  only:
    refs:
      - master
  tags:
    - k8s-mgit-bazel

add:
  stage: add
  variables:
    GIT_STRATEGY: none
  script:
    - ~/upload-deb.py
  only:
    refs:
      - master
  after_script:
    - rm -r deb-out/
  needs:
    - job: upload
      artifacts: true
  tags:
    - mgit
    - pkg

sbom:
  stage: sbom
  script:
    - tools/sbom.sh
  artifacts:
    paths: [sbom/]
    expire_in: 30 days
    reports:
      dotenv: sbom/upload.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  tags:
    - k8s-mgit-bazel


upload-sbom:
  stage: upload-sbom
  image: debian:stable
  before_script:
    - apt-get update && apt-get install -y curl
  needs: [sbom]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -eu
      up() {
        echo "Upload ${TOOL} $1 (latest=$2)"
        curl -v --silent --show-error --fail -X POST "https://deps.mgit.at/api/v1/bom" \
          -H "X-Api-Key: ${DT_API_KEY}" \
          -F autoCreate=true -F projectName="$TOOL" -F projectVersion="$1" \
          -F "parentName=prom-exporter" \
          -F "parentVersion=master" \
          -F isLatest="$2" -F bom=@"sbom/${TOOL}.cdx.json"
      }

      up master false

      code="$(curl -v --silent --show-error --output /dev/null -w '%{http_code}' --get \
        "https://deps.mgit.at/api/v1/project/lookup" \
        -H "X-Api-Key: ${DT_API_KEY}" \
        --data-urlencode "name=${TOOL}" \
        --data-urlencode "version=${SBOM_RELEASE_VERSION}")"

      case "$code" in
        404) up "$SBOM_RELEASE_VERSION" true ;;
        200) echo "Version already exists, no release-upload" ;;
        *)   echo "DT-Lookup failed (HTTP $code)" >&2; exit 1 ;;
      esac
