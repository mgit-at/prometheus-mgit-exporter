---
stages:
  - linter
  - build
  - upload
  - add
  - sbom
  - scan
  - upload-sbom

variables:
  GOLANGCI_LINT_VERSION: 'v2.12.2-alpine'
  TOOL: prometheus-mgit-exporter

lint:
  image: golangci/golangci-lint:$GOLANGCI_LINT_VERSION
  stage: linter
  script:
    # Use default .golangci.yml file from the image if one is not present in the project root.
    - '[ -e .golangci.yml ] || cp /golangci/.golangci.yml .'
    - golangci-lint run -v --config .golangci.yml

build:
  stage: build
  script:
    - bazel build --keep_going //...
  tags:
    - k8s-mgit-bazel

upload:
  stage: upload
  script:
    - upload-deb --config upload-deb.yaml
  artifacts:
    paths:
      - deb-out/*
  only:
    refs:
      - master
  tags:
    - k8s-mgit-bazel

add:
  stage: add
  variables:
    GIT_STRATEGY: none
  script:
    - ~/upload-deb.py
  only:
    refs:
      - master
  after_script:
    - rm -r deb-out/
  needs:
    - job: upload
      artifacts: true
  tags:
    - mgit
    - pkg

sbom:
  stage: sbom
  script:
    - tools/sbom.sh
  artifacts:
    paths: [sbom/]
    expire_in: 30 days
    reports:
      dotenv: sbom/upload.env
  tags:
    - k8s-mgit-bazel

vulnerability_scan:
  stage: scan
  needs: [sbom]
  variables:
    GOVULNCHECK_VERSION: v1.9.0
    GRYPE_VERSION: v0.120.1
  script:
    # Go-SDK from rules_go-Toolchain
    - export PATH="$(bazel run @rules_go//go -- env GOROOT 2>/dev/null)/bin:$PATH"
    - rc=0

    # 1. Run Go vulnerability check
    - go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./... || rc=$?

    # 2. Scan the generated SBOM with Grype
    - GRYPE="go run github.com/anchore/grype/cmd/grype@${GRYPE_VERSION}"
    - $GRYPE db update
    - $GRYPE db status
    - $GRYPE "sbom:sbom/${TOOL}.cdx.json" --config .grype.yaml || rc=$?
    - exit $rc

  allow_failure: true
  tags:
    - k8s-mgit-bazel

upload-sbom:
  stage: upload-sbom
  image: debian:stable
  before_script:
    - apt-get update && apt-get install -y curl
  needs: [sbom]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -eu
      up() {
        echo "Upload ${TOOL} $1 (latest=$2)"
        curl -v --silent --show-error --fail -X POST "https://deps.mgit.at/api/v1/bom" \
          -H "X-Api-Key: ${DT_API_KEY}" \
          -F autoCreate=true -F projectName="$TOOL" -F projectVersion="$1" \
          -F isLatest="$2" -F bom=@"sbom/${TOOL}.cdx.json"
      }

      up master false

      code="$(curl -v --silent --show-error --output /dev/null -w '%{http_code}' --get \
        "https://deps.mgit.at/api/v1/project/lookup" \
        -H "X-Api-Key: ${DT_API_KEY}" \
        --data-urlencode "name=${TOOL}" \
        --data-urlencode "version=${SBOM_RELEASE_VERSION}")"

      case "$code" in
        404) up "$SBOM_RELEASE_VERSION" true ;;
        200) echo "Version already exists, no release-upload" ;;
        *)   echo "DT-Lookup failed (HTTP $code)" >&2; exit 1 ;;
      esac
