---
stages:
  - linter
  - build
  - scan
  - upload
  - add

variables:
  GOLANGCI_LINT_VERSION: 'v2.12.2-alpine'

lint:
  image: golangci/golangci-lint:$GOLANGCI_LINT_VERSION
  stage: linter
  script:
    # Use default .golangci.yml file from the image if one is not present in the project root.
    - '[ -e .golangci.yml ] || cp /golangci/.golangci.yml .'
    - golangci-lint run -v --config .golangci.yml

build:
  stage: build
  script:
    - bazel build --keep_going //...
  tags:
    - k8s-mgit-bazel

vulnerability_scan:
  stage: scan
  script:
    # 1. Run Go vulnerability check
    - bazel run @rules_go//go -- run golang.org/x/vuln/cmd/govulncheck@latest ./...

    # 2. Generate CycloneDX v1.6 SBOM using Syft
    - bazel run @rules_go//go -- run github.com/anchore/syft/cmd/syft@latest dir:. -o cyclonedx-json@1.6=sbom.json

    # 3. Scan the generated SBOM with Grype
    - bazel run @rules_go//go -- run github.com/anchore/grype/cmd/grype@latest sbom:sbom.json --config .grype.yaml
  artifacts:
    name: "sbom-$CI_COMMIT_REF_NAME"
    paths:
      - sbom.json
    expire_in: 30 days
    when: always
  allow_failure: true
  tags:
    - k8s-mgit-bazel

upload:
  stage: upload
  script:
    - upload-deb --config upload-deb.yaml
  artifacts:
    paths:
      - deb-out/*
  only:
    refs:
      - master
  tags:
    - k8s-mgit-bazel

add:
  stage: add
  variables:
    GIT_STRATEGY: none
  script:
    - ~/upload-deb.py
  only:
    refs:
      - master
  after_script:
    - rm -r deb-out/
  needs:
    - job: upload
      artifacts: true
  tags:
    - mgit
    - pkg
